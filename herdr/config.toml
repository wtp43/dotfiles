onboarding = false

[theme]
# Ghostty's ANSI colors: inactive tabs draw on the terminal background, so they
# read as plain numbers, and tab/status text is light enough to read.
name = "terminal"
auto_switch = false

[theme.custom]
# reset = terminal background for the tab bar. surface_dim then colors both the
# active tab's text and the sidebar dividers; Ghostty's background hides the
# dividers (white text on the active tab would make them white too).
panel_bg = "reset"
surface_dim = "#1a1b21"
sidebar_bg = "#1f2126"      # Herdr GPUI's sidebar (sampled)
active_row_bg = "#292a33"   # Herdr GPUI's highlighted rows (sampled)
accent = "#5eb1ff"      # focused pane border and active tab (a lighter Ghostty progress-bar blue)

[ui]
# Herdr has no minimum-drag threshold, so a stray click-drag would clobber the
# clipboard. Copy with y/Enter in copy mode (prefix+[) or ctrl+c / cmd+c.
copy_on_select = false

# Frame every pane, focused one in the accent color. Neighbours share one
# divider (pane_gaps = true would draw two side by side); a shared divider
# touches both panes, so it stays highlighted whichever side has focus.
pane_borders = "always"
pane_outer_borders = true
pane_gaps = false
pane_scrollbars = false

prompt_new_tab_name = false

# The compact collapsed sidebar can't match Herdr GPUI's (machine numbers, no
# agent icons), so collapsing hides it instead.
sidebar_collapsed_mode = "hidden"

# The tab row stands in for the tmux status line: tabs as the window list on
# the left, the tmux status items on the right (see status.sh).
tab_bar_position = "bottom"
tab_bar_right_separator = " ∣ "
# Same order as tmux: status-left, then status-right (remote stats, date).
tab_bar_right = [
  { type = "zoom" },
  { type = "command", command = "~/.config/herdr/status.sh host", interval_seconds = 2, timeout_seconds = 2 },
  { type = "command", command = "~/.config/herdr/status.sh local", interval_seconds = 3, timeout_seconds = 5 },
  { type = "command", command = "~/.config/herdr/status.sh workspace", interval_seconds = 2, timeout_seconds = 2 },
  { type = "command", command = "~/.config/herdr/status.sh remote", interval_seconds = 3, timeout_seconds = 6 },
  { type = "datetime", format = "%b %d" },
]

# Herdr GPUI's comfortable sidebar. $title (" .config") and $agent_line
# ("✳ claude") come from the sidebar-icons plugin, since separate tokens would
# be joined with " · ".
[ui.sidebar.spaces]
row_gap = 1
rows = [
  ["state_icon", "$title"],
  [{ token = "branch", fg = "#f4b8e4" }, "git_status"],
]

[ui.sidebar.agents]
rows = [
  ["state_icon", { token = "machine", rules = [{ equals = "Local", hide = true }] }, "workspace", "tab"],
  ["agent"],
]

[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", { token = "machine", rules = [{ equals = "Local", hide = true }] }, "workspace", "tab"],
  [{ token = "$agent_line", fg = "#6d738a" }],
]

[ui.toast]
# Pop up when a background agent finishes or needs input. "system" posts via
# osascript, so banners show even while Ghostty is focused ("terminal" doesn't).
delivery = "system"

[keys]
prefix = "ctrl+a"

# tmux C-Left / C-Right: previous/next window
previous_tab = ["prefix+p", "ctrl+left"]
next_tab = ["prefix+n", "ctrl+right"]

new_workspace = "prefix+c"
new_tab = "prefix+t"
close_tab = ""
close_pane = ""

# prefix+Tab: next workspace in sidebar order (displaces herdr's prefix+tab
# pane cycling).
next_workspace = "prefix+tab"
cycle_pane_next = ""

# tmux prefix+arrows: resize (prefix+r still enters repeatable resize mode)
resize_pane_left = "prefix+left"
resize_pane_down = "prefix+down"
resize_pane_up = "prefix+up"
resize_pane_right = "prefix+right"

# prefix+h/j/k/l split (below); ctrl+h/j/k/l move focus (below) or navigate mode
focus_pane_left = ""
focus_pane_down = ""
focus_pane_up = ""
focus_pane_right = ""

# vim-tmux-navigator: ctrl+h/j/k/l pass through to (n)vim/fzf, else move focus.
[[keys.command]]
key = "ctrl+h"
type = "shell"
command = "~/.config/herdr/navigate.sh left ctrl+h"
description = "focus left (vim-aware)"

[[keys.command]]
key = "ctrl+j"
type = "shell"
command = "~/.config/herdr/navigate.sh down ctrl+j"
description = "focus down (vim-aware)"

[[keys.command]]
key = "ctrl+k"
type = "shell"
command = "~/.config/herdr/navigate.sh up ctrl+k"
description = "focus up (vim-aware)"

[[keys.command]]
key = "ctrl+l"
type = "shell"
command = "~/.config/herdr/navigate.sh right ctrl+l"
description = "focus right (vim-aware)"

# tmux prefix+h/j/k/l: split left/down/up/right, keeping cwd; from an ssh pane
# the new pane opens the same connection (see split-same.sh).
[[keys.command]]
key = "prefix+h"
type = "shell"
command = "~/.config/herdr/split-same.sh left"
description = "split left"

[[keys.command]]
key = "prefix+j"
type = "shell"
command = "~/.config/herdr/split-same.sh down"
description = "split down"

[[keys.command]]
key = "prefix+k"
type = "shell"
command = "~/.config/herdr/split-same.sh up"
description = "split up"

[[keys.command]]
key = "prefix+l"
type = "shell"
command = "~/.config/herdr/split-same.sh right"
description = "split right"

# Herdr only confirms closing a workspace; these go through the confirm-close plugin.
[[keys.command]]
key = "prefix+x"
type = "plugin_action"
command = "wt.confirm-close.pane"
description = "close pane (confirm)"

[[keys.command]]
key = "prefix+shift+x"
type = "plugin_action"
command = "wt.confirm-close.tab"
description = "close tab (confirm)"
