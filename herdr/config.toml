onboarding = false

[theme]
# Neutral grays like the tmux look; inactive borders use its #5c5c5c (tmux #5a5a5a).
name = "vesper"
auto_switch = false

[theme.custom]
panel_bg = "#3a3a3a" # tab bar, as tmux status-style
accent = "#0a84ff"   # focused pane border and active tab

[ui]
# Herdr has no minimum-drag threshold, so a stray click-drag would clobber the
# clipboard. Copy with y/Enter in copy mode (prefix+[) or ctrl+c / cmd+c.
copy_on_select = false

# tmux-style splitters: no outer frame, panes share dividers, no scrollbars.
pane_outer_borders = false
pane_gaps = false
pane_scrollbars = false

# The tab row stands in for the tmux status line: tabs as the window list on
# the left, the tmux status items on the right (see status.sh).
tab_bar_position = "bottom"
tab_bar_right_separator = " ∣ "
# Same order as tmux: status-left, then status-right (remote stats, date).
tab_bar_right = [
  { type = "zoom" },
  { type = "command", command = "~/.config/herdr/status.sh host", interval_seconds = 2, timeout_seconds = 2 },
  { type = "command", command = "~/.config/herdr/status.sh local", interval_seconds = 3, timeout_seconds = 5 },
  { type = "command", command = "~/.config/herdr/status.sh workspace", interval_seconds = 2, timeout_seconds = 2 },
  { type = "command", command = "~/.config/herdr/status.sh title", interval_seconds = 1, timeout_seconds = 2 },
  { type = "command", command = "~/.config/herdr/status.sh remote", interval_seconds = 3, timeout_seconds = 6 },
  { type = "datetime", format = "%b %d" },
]

[ui.toast]
# Pop up when a background agent finishes or needs input. "system" posts via
# osascript, so banners show even while Ghostty is focused ("terminal" doesn't).
delivery = "system"

[keys]
prefix = "ctrl+a"

# tmux C-Left / C-Right: previous/next window
previous_tab = ["prefix+p", "ctrl+left"]
next_tab = ["prefix+n", "ctrl+right"]

# tmux prefix+Tab: switch-client -n (displaces herdr's prefix+tab pane cycling)
next_workspace = "prefix+tab"
cycle_pane_next = ""

# tmux prefix+arrows: resize (prefix+r still enters repeatable resize mode)
resize_pane_left = "prefix+left"
resize_pane_down = "prefix+down"
resize_pane_up = "prefix+up"
resize_pane_right = "prefix+right"

# prefix+h/j/k/l split (below); ctrl+h/j/k/l move focus (below) or navigate mode
focus_pane_left = ""
focus_pane_down = ""
focus_pane_up = ""
focus_pane_right = ""

# vim-tmux-navigator: ctrl+h/j/k/l pass through to (n)vim/fzf, else move focus.
[[keys.command]]
key = "ctrl+h"
type = "shell"
command = "~/.config/herdr/navigate.sh left ctrl+h"
description = "focus left (vim-aware)"

[[keys.command]]
key = "ctrl+j"
type = "shell"
command = "~/.config/herdr/navigate.sh down ctrl+j"
description = "focus down (vim-aware)"

[[keys.command]]
key = "ctrl+k"
type = "shell"
command = "~/.config/herdr/navigate.sh up ctrl+k"
description = "focus up (vim-aware)"

[[keys.command]]
key = "ctrl+l"
type = "shell"
command = "~/.config/herdr/navigate.sh right ctrl+l"
description = "focus right (vim-aware)"

# tmux prefix+h/j/k/l: split left/down/up/right, keeping cwd; from an ssh pane
# the new pane opens the same connection (see split-same.sh).
[[keys.command]]
key = "prefix+h"
type = "shell"
command = "~/.config/herdr/split-same.sh left"
description = "split left"

[[keys.command]]
key = "prefix+j"
type = "shell"
command = "~/.config/herdr/split-same.sh down"
description = "split down"

[[keys.command]]
key = "prefix+k"
type = "shell"
command = "~/.config/herdr/split-same.sh up"
description = "split up"

[[keys.command]]
key = "prefix+l"
type = "shell"
command = "~/.config/herdr/split-same.sh right"
description = "split right"
