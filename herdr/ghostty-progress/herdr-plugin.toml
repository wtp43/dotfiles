id = "wt.ghostty-progress"
name = "Ghostty progress"
version = "0.1.0"
min_herdr_version = "0.9.3"
description = "Show Ghostty's progress bar while an agent in the focused tab is working"
platforms = ["macos", "linux"]

# Herdr consumes agents' OSC 9;4 progress instead of passing it through, so
# re-emit it to the outer terminal from agent state. Claude Code's
# progress-keepalive hook doesn't replace this: its bar never leaves herdr.
# progress.sh starts a refresher loop; these hooks make focus and state
# changes show immediately.
[[startup]]
command = ["bash", "progress.sh", "sync"]

[[events]]
on = "pane.agent_status_changed"
command = ["bash", "progress.sh", "sync"]

[[events]]
on = "pane.focused"
command = ["bash", "progress.sh", "sync"]

[[events]]
on = "tab.focused"
command = ["bash", "progress.sh", "sync"]

[[events]]
on = "workspace.focused"
command = ["bash", "progress.sh", "sync"]

[[events]]
on = "pane.closed"
command = ["bash", "progress.sh", "sync"]

[[events]]
on = "tab.closed"
command = ["bash", "progress.sh", "sync"]
